name: Deploy Turnkey Store

# Runs when you click "Run workflow" in the Actions tab, or when the store app changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "member/app/**"
      - ".github/workflows/deploy-store.yml"

permissions:
  contents: write   # to save the live store address into member/store-config.js
  pages: write      # to refresh pinservs.com after that

concurrency:
  group: deploy-store
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: member/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cloudflare tools
        run: npm install --no-audit --no-fund

      - name: Deploy the store
        id: deploy
        run: node scripts/deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

      - name: Connect the shop to the live store
        if: steps.deploy.outputs.url != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "turnkey-deploy[bot]"
          git config user.email "turnkey-deploy@users.noreply.github.com"
          git add member/store-config.js
          if git diff --cached --quiet; then
            echo "Shop already points at ${{ steps.deploy.outputs.url }}"
          else
            git commit -m "Connect shop to live store at ${{ steps.deploy.outputs.url }}"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1 || echo "Pages will refresh on its own."
          fi
