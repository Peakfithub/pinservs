name = "turnkey-store"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
# Your shop page: buyers return here if they cancel checkout, and the logo links here
SHOP_URL = "https://pinservs.com/member/"
# How many days after paying a buyer can use their purchase link to create a password
SUCCESS_WINDOW_DAYS = "7"

# Private storage for the PDF and ZIP files. Nothing here is public.
[[r2_buckets]]
binding = "FILES"
bucket_name = "turnkey-site-files"

# Members, orders and sign-in limits. The deploy action fills in the id.
[[kv_namespaces]]
binding = "DATA"
id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"

# Secrets: added by the GitHub deploy action from your repository secrets
# (or by hand with `npx wrangler secret put NAME`). Never written in this file.
#   ADMIN_EMAIL             your admin sign-in email
#   ADMIN_PASSWORD          your admin sign-in password (12+ characters)
#   STRIPE_SECRET_KEY       your Stripe secret key (sk_test_... or sk_live_...)
#   STRIPE_WEBHOOK_SECRET   optional: signing secret of your Stripe webhook (whsec_...)
#   SIGNING_SECRET          created automatically on the first deploy
